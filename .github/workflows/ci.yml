name: Validar protótipo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Preparar bibliotecas de janela no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run -p nator-prototype --locked -- --export-reference reference.stl
      - run: cargo run -p nator-prototype --locked -- --inspect reference.stl
      - run: cargo run -p nator-prototype --no-default-features --locked -- --validate-project validation-output/project
      - run: cargo run -p nator-prototype --no-default-features --locked -- --inspect-project validation-output/project/support.3dnator
      - uses: actions/upload-artifact@v4
        with:
          name: project-${{ runner.os }}
          path: validation-output/project/

  occt-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Preparar SDK OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libocct-data-exchange-dev libocct-modeling-algorithms-dev
      - run: cargo clippy -p nator-prototype --no-default-features --features occt --locked -- -D warnings
      - run: cargo test -p nator-kernel -p nator-commands --features occt --locked
      - run: cargo run -p nator-prototype --no-default-features --features occt --locked -- --validate validation-output/linux
      - run: cargo run -p nator-prototype --no-default-features --features occt --locked -- --validate-part validation-output/linux-part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occt-linux
          path: validation-output/
          if-no-files-found: warn

  occt-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: nator
          python-version: '3.12'
      - name: Preparar SDK OCCT 7.x
        run: conda install -y -c conda-forge 'occt>=7.8,<8' cmake
      - name: Compilar e validar núcleo
        run: |
          export CMAKE_PREFIX_PATH="$CONDA_PREFIX/Library"
          export PATH="$CONDA_PREFIX/Library/bin:$PATH"
          cargo clippy -p nator-prototype --no-default-features --features occt --locked -- -D warnings
          cargo test -p nator-kernel -p nator-commands --features occt --locked
          cargo run -p nator-prototype --no-default-features --features occt --locked -- --validate validation-output/windows
          cargo run -p nator-prototype --no-default-features --features occt --locked -- --validate-part validation-output/windows-part
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: occt-windows
          path: validation-output/
          if-no-files-found: warn
